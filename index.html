<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 과학 실험실</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#191b2e;--mu:#646a87;--gr:#e2e5f0;--ac:#4f6bed;--sub:#4f6bed;--am:#d97706;--ok:#059669;--bad:#dc2626;--sh:0 1px 2px rgba(20,25,60,.06),0 4px 14px rgba(20,25,60,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#11131f;--card:#1b1e2e;--tx:#eceefa;--mu:#9da3c4;--gr:#2d3148;--ac:#8fa2ff;--am:#fbbf24;--ok:#34d399;--bad:#f87171;--sh:none;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--gr)}
.top .in{max-width:1180px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;text-decoration:none;display:flex;gap:8px;align-items:center}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{text-decoration:none;font-size:13px;padding:6px 11px;border-radius:99px;color:var(--mu)}
.nav a:hover{background:var(--card)}.nav a.on{background:var(--c);color:#fff}
main{max-width:1180px;margin:auto;padding:18px}
.hero{padding:26px 4px 10px}.hero h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}.hero p{color:var(--mu);margin:0;font-size:15px;line-height:1.6}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:22px}
.sc{background:var(--card);border-radius:16px;padding:18px;text-decoration:none;box-shadow:var(--sh);border:1px solid var(--gr);position:relative;overflow:hidden;transition:transform .15s}
.sc:hover{transform:translateY(-3px)}
.sc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 15%,transparent);margin-bottom:12px}
.sc h3{margin:0 0 2px;font-size:18px}.sc small{color:var(--c);font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.sc ul{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mu);line-height:1.8}
.sc::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--c)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.lc{background:var(--card);border-radius:16px;text-decoration:none;box-shadow:var(--sh);border:1px solid var(--gr);overflow:hidden;transition:transform .15s;display:flex;flex-direction:column}
.lc:hover{transform:translateY(-3px)}
.lc .art{height:130px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#000),var(--c));display:grid;place-items:center;color:#fff}
.lc .art svg{width:100%;height:100%}
.lc .bd{padding:14px 16px 16px}.lc h3{margin:0 0 6px;font-size:16px}.lc p{margin:0;font-size:13px;color:var(--mu);line-height:1.55}
.lc .n{font-size:12px;font-weight:700;color:var(--c)}
.crumb{font-size:13px;color:var(--mu);margin:2px 0 6px}.crumb a{text-decoration:none;color:var(--mu)}.crumb a:hover{color:var(--tx)}
h2.lt{font-size:23px;margin:0 0 4px;letter-spacing:-.3px}.ld{color:var(--mu);font-size:14px;margin:0 0 14px;line-height:1.55}
.lab{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px}.mainc{display:flex;flex-direction:column;gap:12px;min-width:0}
.c{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--sh);border:1px solid var(--gr)}
.c h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.ctl{margin:9px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:3px;gap:8px}.ctl label b{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sub);margin:2px 0}
select,input[type=text],input[type=number],textarea{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--gr);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--gr);background:var(--bg);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--sub)}button.p{background:var(--sub);color:#fff;border-color:var(--sub)}button.on{background:color-mix(in srgb,var(--sub) 18%,var(--bg));border-color:var(--sub)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}.seg button{flex:1;border:0;background:transparent;padding:6px 8px;white-space:nowrap}.seg button.on{background:var(--card);box-shadow:var(--sh);color:var(--sub);font-weight:700}
canvas{width:100%;height:auto;display:block;touch-action:none;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mu)}.stats b{display:block;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums;margin-top:2px}
.ex p{font-size:13.5px;line-height:1.65;margin:7px 0}.ex .k{color:var(--sub);font-weight:700;margin-right:4px}
.ex .ok{color:var(--ok);font-weight:700}.ex .warn{color:var(--am);font-weight:700}
.note{font-size:12.5px;color:var(--mu);line-height:1.6;margin:6px 0 0}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mu);margin:6px 0;cursor:pointer}.chk input{accent-color:var(--sub)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--gr);text-align:right}table.t th{color:var(--mu);font-weight:600}table.t td:first-child,table.t th:first-child{text-align:center}
.scroll{overflow:auto;max-height:300px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:700px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--mu);margin-top:4px}
footer{max-width:1180px;margin:20px auto 30px;padding:0 18px;color:var(--mu);font-size:12px}
</style></head><body>
<header class="top"><div class="in"><a class="brand" href="#">🔬 가상 과학 실험실</a><nav class="nav" id="nav"></nav></div></header>
<main id="app"></main>
<footer>모든 실험실은 브라우저 안에서 지배 방정식을 직접 수치 적분해 계산하며, 같은 값을 이론식으로 손계산한 결과와 나란히 보여 줍니다.</footer>
<script>
'use strict';
/* ===================== 공통 유틸 ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const SUPD={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':''};
const sup=s=>String(s).split('').map(c=>SUPD[c]??c).join('');
/** 숫자 표시: 아주 작거나 큰 값은 a×10ⁿ */
function F(x,d=3){if(x===null||x===undefined||isNaN(x))return '—';if(!isFinite(x))return x>0?'∞':'−∞';if(x===0)return '0';const a=Math.abs(x);
 if(a<1e-3||a>=1e5){let [m,e]=x.toExponential(d-1).split('e');return m.replace('-','−')+'×10'+sup(+e)}
 const dec=Math.max(0,d-1-Math.floor(Math.log10(a)));return (+x.toFixed(Math.min(dec,8))).toString().replace('-','−')}
const fx=(x,n)=>x.toFixed(n).replace('-','−');
const SIP=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'μ'],[1e-9,'n'],[1e-12,'p']];
function si(x,u,d=3){if(x===0)return '0 '+u;const a=Math.abs(x);for(const [f,p] of SIP)if(a>=f*0.9995)return F(x/f,d)+' '+p+u;return F(x,d)+' '+u}

/* ===================== 과목 & 실험실 등록 ===================== */
const SUBJECTS={
 physics:{name:'물리학',en:'Physics',icon:'⚛️',c:'#3b82f6',d:'역학·파동·전기회로의 기본 방정식을 직접 적분합니다.'},
 chemistry:{name:'화학',en:'Chemistry',icon:'⚗️',c:'#8b5cf6',d:'분자 운동, 화학 평형, 전기화학을 정량적으로 탐구합니다.'},
 biology:{name:'생명과학',en:'Biology',icon:'🧬',c:'#10b981',d:'유전 정보, 진화, 신경 신호를 모형으로 재현합니다.'},
 earth:{name:'지구과학',en:'Earth Science',icon:'🌏',c:'#f59e0b',d:'판 운동, 해양 순환, 천체 궤도를 관찰합니다.'},
 math:{name:'수학',en:'Mathematics',icon:'∑',c:'#ec4899',d:'수치해석, 공간도형, 미분방정식을 눈으로 확인합니다.'}};
const LABS=[];
function lab(d){LABS.push(d)}

/* ===================== 라우터 ===================== */
let CLEAN=null;
function setSub(k){const c=k?SUBJECTS[k].c:'#4f6bed';document.documentElement.style.setProperty('--sub',c)}
function nav(cur){$('#nav').innerHTML=Object.entries(SUBJECTS).map(([k,s])=>`<a href="#${k}" style="--c:${s.c}" class="${cur===k?'on':''}">${s.name}</a>`).join('')}
function route(){
 if(CLEAN){try{CLEAN()}catch(e){console.error(e)}CLEAN=null}
 const h=decodeURIComponent(location.hash.slice(1)),app=$('#app');window.scrollTo(0,0);
 const L=LABS.find(l=>l.id===h);
 if(L){setSub(L.sub);nav(L.sub);const S=SUBJECTS[L.sub];document.title=L.title+' · 가상 과학 실험실';
  app.innerHTML=`<div class="crumb"><a href="#">홈</a> › <a href="#${L.sub}">${S.name}</a> › ${L.title}</div><h2 class="lt">${L.icon} ${L.title}</h2><p class="ld">${L.long||L.desc}</p><div id="labroot"></div>`;
  try{CLEAN=L.mount($('#labroot'))||null}catch(e){console.error(e);$('#labroot').innerHTML='<div class="c">오류: '+e.message+'</div>'}
  return}
 if(SUBJECTS[h]){const S=SUBJECTS[h];setSub(h);nav(h);document.title=S.name+' · 가상 과학 실험실';
  const ls=LABS.filter(l=>l.sub===h);
  app.innerHTML=`<div class="crumb"><a href="#">홈</a> › ${S.name}</div><div class="hero" style="padding-top:6px"><h1>${S.icon} ${S.name} 실험실</h1><p>${S.d}</p></div>
  <div class="labs">${ls.map((l,i)=>`<a class="lc" href="#${l.id}" style="--c:${S.c}"><div class="art">${l.art||''}</div><div class="bd"><div class="n">실험실 ${'①②③'[i]}</div><h3>${l.icon} ${l.title}</h3><p>${l.desc}</p></div></a>`).join('')}</div>`;return}
 setSub(null);nav(null);document.title='가상 과학 실험실';
 app.innerHTML=`<div class="hero"><h1>가상 과학 실험실</h1><p>물리·화학·생명과학·지구과학·수학, 다섯 과목 15개의 실험실입니다. 변수를 바꾸면 시뮬레이션이 바로 다시 계산되고, 각 실험실 아래 <b>계산 과정</b> 카드에서 이론식으로 구한 값과 수치 시뮬레이션 값을 비교할 수 있습니다.</p></div>
 <div class="subs">${Object.entries(SUBJECTS).map(([k,s])=>`<a class="sc" href="#${k}" style="--c:${s.c}"><div class="ic">${s.icon}</div><small>${s.en}</small><h3>${s.name}</h3><ul>${LABS.filter(l=>l.sub===k).map(l=>`<li>${l.icon} ${l.title}</li>`).join('')}</ul></a>`).join('')}</div>`}
addEventListener('hashchange',route);

/* ===================== 컨트롤 ===================== */
/** 슬라이더 HTML. o: {log:true(값=10^v), dec, unit, si} */
function S(id,label,min,max,step,val,o={}){return `<div class="ctl"><label for="${id}"><span>${label}</span><b id="${id}-v"></b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-o='${JSON.stringify(o)}'></div>`}
function V(root,id){const e=root.querySelector('#'+id);if(!e)return NaN;if(e.type==='checkbox')return e.checked;if(e.type!=='range')return e.value;const o=JSON.parse(e.dataset.o||'{}');return o.log?Math.pow(10,+e.value):+e.value}
function setV(root,id,x){const e=root.querySelector('#'+id),o=JSON.parse(e.dataset.o||'{}');e.value=o.log?Math.log10(x):x;showV(root,e)}
function showV(root,e){const o=JSON.parse(e.dataset.o||'{}'),v=o.log?Math.pow(10,+e.value):+e.value,t=root.querySelector('#'+e.id+'-v');if(!t)return;
 t.textContent=o.si?si(v,o.si,3):(o.dec!==undefined?fx(v,o.dec):F(v,3))+(o.unit?' '+o.unit:'')}
/** 루트 안 모든 입력에 이벤트 연결 */
function wire(root,fn){$$('input,select,textarea',root).forEach(e=>{if(e.type==='range')showV(root,e);e.addEventListener('input',ev=>{if(e.type==='range')showV(root,e);fn&&fn(e.id,ev)})})}
function seg(id,opts,cur){return `<div class="seg" id="${id}">${opts.map(([v,t])=>`<button data-v="${v}" class="${v==cur?'on':''}">${t}</button>`).join('')}</div>`}
function onSeg(root,id,fn){const el=root.querySelector('#'+id);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',el).forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v)})}
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;$$('button',b.parentNode).forEach(x=>x.classList.toggle('on',x===b))},true);
function segVal(root,id){return root.querySelector('#'+id+' button.on').dataset.v}
function stats(arr){return arr.map(([id,l])=>`<div>${l}<b id="${id}">—</b></div>`).join('')}
function put(root,id,v){const e=root.querySelector('#'+id);if(e)e.innerHTML=v}
/** 계산 과정 카드 */
function explain(el,o){el.innerHTML=(o.pre?`<p>${o.pre}</p>`:'')+`<p><span class="k">① 상황</span>${o.s}</p><p><span class="k">② 사용하는 식</span>${o.f}</p><p><span class="k">③ 대입·계산</span>${o.c}</p><p><span class="k">④ 결과</span>${o.r}</p>`}
function cmp(theory,sim,unit='',tol=0.02){const e=Math.abs(sim-theory)/(Math.abs(theory)||1);return `이론값 <b>${F(theory,4)}${unit}</b> · 시뮬레이션 값 <b>${F(sim,4)}${unit}</b> · 상대 오차 ${F(e*100,2)}% `+(e<=tol?'<span class="ok">✓ 일치</span>':'<span class="warn">차이 있음</span>')}

/* ===================== 캔버스 ===================== */
function C(id,w,h){return `<canvas id="${id}" data-w="${w}" data-h="${h}" width="${w}" height="${h}"></canvas>`}
function ctx(c){const w=+c.dataset.w,h=+c.dataset.h,dpr=Math.min(2,window.devicePixelRatio||1);c.width=w*dpr;c.height=h*dpr;c.style.aspectRatio=w+'/'+h;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.W=w;g.H=h;g.clr=()=>{g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h)};return g}
function ptr(c,e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*(+c.dataset.w)/r.width,(e.clientY-r.top)*(+c.dataset.h)/r.height]}
function anim(fn){let id,last=performance.now(),run=true;const f=t=>{if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;try{fn(dt,t)}catch(e){console.error(e);run=false;return}id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>{run=false;cancelAnimationFrame(id)}}
function niceTicks(a,b,n=5){if(!(b>a)){b=a+1}const sp=(b-a)/n,m=Math.pow(10,Math.floor(Math.log10(sp))),r=sp/m,st=(r<1.5?1:r<3?2:r<7?5:10)*m,o=[];for(let x=Math.ceil(a/st-1e-9)*st;x<=b+st*1e-9;x+=st)o.push(Math.abs(x)<st*1e-9?0:x);return o}
/** 선 그래프. b={x,y,w,h}; o={xr,yr,xl,yl,s:[{d:[[x,y]],c,w,dash,fill}],vl:[{x,c,t}],hl:[{y,c,t}],logy} */
function plot(g,b,o){const {x:X0,y:Y0,w,h}=b,[xa,xb]=o.xr;let [ya,yb]=o.yr;const L=o.logy;
 const tx=x=>X0+w*(x-xa)/(xb-xa),ty=y=>{if(L){y=Math.log10(Math.max(y,1e-300));return Y0+h-h*(y-ya)/(yb-ya)}return Y0+h-h*(y-ya)/(yb-ya)};
 g.save();g.font='11px system-ui,sans-serif';g.lineWidth=1;const gr=css('--gr'),mu=css('--mu');
 g.strokeStyle=gr;g.fillStyle=mu;g.textAlign='center';
 if(!o.noX){const xts=niceTicks(xa,xb,o.xt||6);let xe=0;if(!o.xf){const m=Math.max(...xts.map(Math.abs));if(m>0&&(m<0.01||m>=1e5))xe=Math.floor(Math.log10(m))}
  for(const t of xts){const x=tx(t);g.beginPath();g.moveTo(x,Y0);g.lineTo(x,Y0+h);g.stroke();g.fillText(o.xf?o.xf(t):F(xe?t/Math.pow(10,xe):t,3),x,Y0+h+13)}
  if(xe){g.textAlign='right';g.fillText('×10'+sup(xe),X0+w,Y0+h+27)}}
 g.textAlign='right';
 const yts=L?(()=>{const r=[];for(let k=Math.ceil(ya);k<=yb;k+=Math.max(1,Math.round((yb-ya)/5)))r.push(k);return r})():niceTicks(ya,yb,o.yt||5);
 let ye=0;if(!L&&!o.yf){const m=Math.max(...yts.map(Math.abs));if(m>0&&(m<0.01||m>=1e5))ye=Math.floor(Math.log10(m))}
 for(const t of yts){const y=L?Y0+h-h*(t-ya)/(yb-ya):ty(t);g.beginPath();g.moveTo(X0,y);g.lineTo(X0+w,y);g.stroke();g.fillText(L?'10'+sup(t):(o.yf?o.yf(t):F(ye?t/Math.pow(10,ye):t,3)),X0-4,y+4)}
 if(ye){g.textAlign='left';g.fillText('×10'+sup(ye),X0+3,Y0+11)}
 g.strokeStyle=mu;g.strokeRect(X0,Y0,w,h);
 if(o.xl){g.textAlign='center';g.fillText(o.xl,X0+w/2,Y0+h+27)}
 if(o.yl){g.save();g.translate(X0-38,Y0+h/2);g.rotate(-Math.PI/2);g.textAlign='center';g.fillText(o.yl,0,0);g.restore()}
 g.beginPath();g.rect(X0,Y0,w,h);g.clip();
 for(const s of o.s||[]){if(!s.d||s.d.length<1)continue;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);

  function reset(){P={m1:V(R,'m1'),m2:V(R,'m2'),L1:V(R,'L1'),L2:V(R,'L2'),g:V(R,'gg')};const d2r=Math.PI/180;
   y=[V(R,'t1')*d2r,V(R,'t2')*d2r,0,0];yb=[y[0]+V(R,'dth')*d2r,y[1],0,0];t=0;E0=dpE(P,y).E;hist=[];sep=[];trail=[];trailB=[]}

  const h=5e-4;

   const dtr=(arr,col)=>{if(!V(R,'trail')||arr.length<2)return;for(let i=1;i<arr.length;i++){g.strokeStyle=col;g.globalAlpha=i/arr.length*.8;g.lineWidth=1.6;g.beginPath();g.moveTo(X(arr[i-1]),Y(arr[i-1]));g.lineTo(X(arr[i]),Y(arr[i]));g.stroke()}g.globalAlpha=1};

   g.font='12px system-ui';g.fillStyle=css('--mu');g.textAlign='left';g.fillText('t = '+t.toFixed(2)+' s',12,20);if(cmpOn){g.fillStyle='#f43f5e';g.fillText('● 쌍둥이 진자 (θ₁ + '+F(V(R,'dth'),2)+'°)',12,38)}
   // 에너지 그래프
   ge.clr();const t0=Math.max(0,t-20),Emax=Math.max(E0,1e-9)*1.15;

   if(cmpOn){gs.clr();plot(gs,{x:46,y:8,w:660,h:130},{xr:[0,Math.max(10,t)],yr:[-7,1],logy:true,xl:'시간 (s)',s:[{d:sep,c:'#f43f5e'}]})}
   const e=dpE(P,y),l=lyap();put(R,'st',t.toFixed(2)+' s');put(R,'sT',F(e.T)+' J');put(R,'sU',F(e.U)+' J');put(R,'sE',F(e.E,5)+' J');put(R,'sdE',F(Math.abs(e.E-E0)/E0,2));put(R,'sL',cmpOn&&isFinite(l)?F(l,3)+' s⁻¹':'—');
   if((tick++)%6===0)expl(e,l)}
  function expl(e,l){const {m1,m2,L1,L2,g:G}=P,[a1,a2,w1,w2]=y;const D=180/Math.PI,M=m1+m2;
   const sm=Math.abs(V(R,'t1'))<=15&&Math.abs(V(R,'t2'))<=15;
   const disc=Math.sqrt(M*M*(L1+L2)**2-4*m1*M*L1*L2),wp=Math.sqrt(G*(M*(L1+L2)+disc)/(2*m1*L1*L2)),wm=Math.sqrt(G*(M*(L1+L2)-disc)/(2*m1*L1*L2));

    s:'외력이 하는 일이 없고 마찰이 없으므로 역학적 에너지 E = T + U 가 처음 값 E₀ 로 보존되어야 합니다.',
    f:'T = ½m₁L₁²ω₁² + ½m₂[L₁²ω₁² + L₂²ω₂² + 2L₁L₂ω₁ω₂cos(θ₁−θ₂)],  U = (m₁+m₂)gL₁(1−cosθ₁) + m₂gL₂(1−cosθ₂)',
    c:`E₀ = (${F(M)})(${F(G)})(${F(L1)})(1−cos${V(R,'t1')}°) + (${F(m2)})(${F(G)})(${F(L2)})(1−cos${V(R,'t2')}°) = <b>${F(E0,6)} J</b><br>지금: T = ${F(e.T,5)} J, U = ${F(e.U,5)} J → E = ${F(e.E,6)} J`+

  const stop=anim(dt=>{if(run){const T=dt*V(R,'spd'),n=Math.round(T/h),f=dpF(P),cmpOn=V(R,'cmp');
    for(let i=0;i<n;i++){y=rk4(f,y,t,h);if(cmpOn)yb=rk4(f,yb,t,h);t+=h}

     const d=Math.hypot(Math.atan2(Math.sin(y[0]-yb[0]),Math.cos(y[0]-yb[0])),Math.atan2(Math.sin(y[1]-yb[1]),Math.cos(y[1]-yb[1])));if(sep.length===0||t-sep[sep.length-1][0]>0.03)sep.push([t,d]);if(sep.length>3000)sep.shift()}}

lab({id:'phys-wave',sub:'physics',icon:'🌊',title:'파동 간섭 실험실',

  </div></div>`;
  const cv=$('#cv',R),g=ctx(cv),gI=ctx($('#cI',R)),NX=240,NY=160,XW=60,YH=40,v=24,YS=36;
  const off=document.createElement('canvas');off.width=NX;off.height=NY;const og=off.getContext('2d'),img=og.createImageData(NX,NY);

  cv.addEventListener('pointerdown',e=>{const [px,py]=ptr(cv,e);probe=[px/720*XW-XW/2,YH-py/480*YH]});
  const par=()=>{const f1=V(R,'f1'),f2=V(R,'lock')?f1:V(R,'f2'),d=V(R,'d');return {f1,f2,A1:V(R,'A1'),A2:V(R,'A2'),ph:V(R,'ph')*Math.PI/180,d,dec:V(R,'decay'),s1:[-d/2,4],s2:[d/2,4]}};
  const amp=(A,r,dec)=>dec?A*Math.sqrt(2/Math.max(r,2)):A;
  function yAt(p,x,y,tt){const r1=Math.hypot(x-p.s1[0],y-p.s1[1]),r2=Math.hypot(x-p.s2[0],y-p.s2[1]);
   return amp(p.A1,r1,p.dec)*Math.cos(2*Math.PI*p.f1*tt-2*Math.PI*p.f1/v*r1)+amp(p.A2,r2,p.dec)*Math.cos(2*Math.PI*p.f2*tt-2*Math.PI*p.f2/v*r2+p.ph)}
  function Ith(p,x,y){const r1=Math.hypot(x-p.s1[0],y-p.s1[1]),r2=Math.hypot(x-p.s2[0],y-p.s2[1]),a1=amp(p.A1,r1,p.dec),a2=amp(p.A2,r2,p.dec);
   if(Math.abs(p.f1-p.f2)>1e-9)return a1*a1+a2*a2;const del=2*Math.PI*p.f1/v*(r2-r1)-p.ph;return a1*a1+a2*a2+2*a1*a2*Math.cos(del)}
  const bg=hexRgb(css('--card')),RED=[225,29,72],BLU=[37,99,235],YEL=[255,236,140];
  function frame(dt){const p=par(),mode=segVal(R,'mode'),T=dt*V(R,'spd');t+=T;
   const norm=Math.max(p.A1+p.A2,1e-6),dec=p.dec;let k=0;
   for(let j=0;j<NY;j++){const y=YH*(1-(j+.5)/NY);for(let i=0;i<NX;i++,k++){const x=XW*(i+.5)/NX-XW/2,val=yAt(p,x,y,t);acc[k]+=val*val;
     let c;if(mode==='y'){const s=clamp(val/norm*(dec?2:1),-1,1);c=s>=0?RED:BLU;const a=Math.abs(s);img.data[k*4]=bg[0]+(c[0]-bg[0])*a;img.data[k*4+1]=bg[1]+(c[1]-bg[1])*a;img.data[k*4+2]=bg[2]+(c[2]-bg[2])*a}

     img.data[k*4+3]=255}}

   og.putImageData(img,0,0);g.clr();g.imageSmoothingEnabled=true;g.drawImage(off,0,0,720,480);
   const X=x=>(x+XW/2)/XW*720,Y=y=>(YH-y)/YH*480;
   // 마디선

    for(let m=-12;m<=12;m++){const D=((2*m+1)*Math.PI+p.ph)/kk;if(Math.abs(D)>=p.d)continue;g.beginPath();let st=false;
     for(let y=4.05;y<=YH;y+=0.4){const fn=x=>Math.hypot(x-p.s2[0],y-4)-Math.hypot(x-p.s1[0],y-4)-D;const x=bisect(fn,-200,200,60);if(x<-XW/2-1||x>XW/2+1){st=false;continue}st?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y));st=true}g.stroke()}
    g.setLineDash([]);g.globalAlpha=1}
   g.strokeStyle='#fff';g.setLineDash([3,3]);g.lineWidth=1;g.beginPath();g.moveTo(0,Y(YS));g.lineTo(720,Y(YS));g.stroke();g.setLineDash([]);
   for(const [s,l] of [[p.s1,'S₁'],[p.s2,'S₂']]){g.fillStyle='#111';g.beginPath();g.arc(X(s[0]),Y(s[1]),6,0,7);g.fill();g.fillStyle='#fff';g.font='bold 12px system-ui';g.fillText(l,X(s[0])-7,Y(s[1])+20)}
   g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.arc(X(probe[0]),Y(probe[1]),8,0,7);g.stroke();g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.arc(X(probe[0]),Y(probe[1]),8,0,7);g.stroke();
   g.font='12px system-ui';g.fillStyle=mode==='y'?css('--tx'):'#fff';g.fillText('1 칸 = '+(XW/NX).toFixed(2)+' cm · 가로 60 cm × 세로 40 cm',10,16);
   // 스크린 그래프
   gI.clr();const th=[],sm=[];let mx=0;for(let i=0;i<=240;i++){const x=-XW/2+XW*i/240,a=Ith(p,x,YS),b=2*scr[i]/Math.max(nscr,1);th.push([x,a]);sm.push([x,b]);mx=Math.max(mx,a,b)}

   info(p)}
  let tk=0;function info(p){if(tk++%5)return;const lam=v/p.f1,r1=Math.hypot(probe[0]-p.s1[0],probe[1]-p.s1[1]),r2=Math.hypot(probe[0]-p.s2[0],probe[1]-p.s2[1]),dr=r2-r1;
   const a1=amp(p.A1,r1,p.dec),a2=amp(p.A2,r2,p.dec),coh=Math.abs(p.f1-p.f2)<1e-9;

   put(R,'beat',coh?'진동수가 같아 간섭 무늬가 시간에 따라 변하지 않습니다(정상 간섭 무늬).':`진동수가 달라(Δf = ${F(Math.abs(p.f1-p.f2))} Hz) 위상차가 계속 변하므로 무늬가 ${F(1/Math.abs(p.f1-p.f2),3)} s 주기로 움직이고(맥놀이), 오래 평균하면 세기가 I₁ + I₂로 고르게 됩니다.`);

      const dvx=vx[j]-vx[i],dvy=vy[j]-vy[i],dot=dx*dvx+dy*dvy;if(dot>=0)continue;const k=dot/dd;// 같은 질량 탄성 충돌: 법선 성분 교환

const AACOL={n:'#f59e0b','p':'#10b981','+':'#3b82f6','-':'#ef4444','s':'#6b7280'};
const BCOL={A:'#ef4444',T:'#f59e0b',U:'#a855f7',G:'#10b981',C:'#3b82f6'};
const COMP={A:'T',T:'A',G:'C',C:'G'},RCOMP={A:'U',T:'A',G:'C',C:'G'};
function translate(rna){const st=rna.indexOf('AUG');if(st<0)return {start:-1,codons:[],prot:''};const codons=[];let prot='';for(let i=st;i+3<=rna.length;i+=3){const c=rna.slice(i,i+3),a=CODON[c];codons.push([i,c,a]);if(a==='*')break;prot+=a}return {start:st,codons,prot,complete:codons.length&&codons[codons.length-1][2]==='*'}}

    const frag=8,lagDone=Math.floor(k/frag)*frag;

  function protRow(tr,ref){return tr.codons.map(([i,c,a],j)=>{const r=ref&&ref.codons[j],diff=ref&&(!r||r[2]!==a);return `<span style="display:inline-flex;flex-direction:column;align-items:center;margin:2px;padding:3px 4px;border-radius:7px;${diff?'background:color-mix(in srgb,#ef4444 18%,transparent);outline:1.5px solid #ef4444':''}"><span class="mono" style="font-size:11px;color:var(--mu)">${c}</span><b style="font-size:12px;color:${AACOL[AA[a][3]]}">${a==='*'?'종결':AA[a][0]}</b></span>`}).join('')}

   explain($('#ex',R),{pre:`집단 1, ${gen}세대: p = ${F(p,4)}, q = 1 − p = ${F(q,4)}, w_AA = ${F(w[0],3)}, w_Aa = ${F(w[1],3)}, w_aa = ${F(w[2],3)}`,
    s:'무작위 교배로 하디–바인베르크 비율(p², 2pq, q²)의 개체가 태어난 뒤, 유전자형마다 다른 비율로 살아남아(적응도) 번식합니다.'+(V(R,'inf')?'':` 집단이 ${N}개체로 유한하므로 다음 세대 대립유전자 2N = ${2*N}개를 무작위로 뽑는 과정에서 우연한 변동(유전적 부동)이 생깁니다.`),
    f:'w̄ = p²w_AA + 2pq·w_Aa + q²w_aa,  p′ = (p²w_AA + pq·w_Aa) / w̄,  Δp = p′ − p<br>유전적 부동: p″ ~ 이항분포(2N, p′)/2N, 표준편차 √(p′q′/2N)'+(V(R,'env')==='het'?',  이형접합자 우위 평형 p̂ = t/(s + t) (w_AA = 1−s, w_aa = 1−t)':''),
    c:`w̄ = (${F(p,4)})²(${F(w[0],3)}) + 2(${F(p,4)})(${F(q,4)})(${F(w[1],3)}) + (${F(q,4)})²(${F(w[2],3)}) = ${F(wbar,5)}<br>p′ = [(${F(p,4)})²(${F(w[0],3)}) + (${F(p,4)})(${F(q,4)})(${F(w[1],3)})] / ${F(wbar,5)} = ${F(ps,5)} → Δp = ${F(ps-p,4)}`+
     (V(R,'inf')?'':`<br>부동에 의한 표준편차 = √(${F(ps,3)} × ${F(1-ps,3)} / ${2*N}) = ${F(sd,3)}`)+(V(R,'env')==='het'?`<br>p̂ = ${F(V(R,'t2'),3)} / (${F(V(R,'s'),3)} + ${F(V(R,'t2'),3)}) = ${F(pe,4)}`:''),
    r:`반복 집단 평균 ${cmp(pth,mean,'',0.05)}`+(V(R,'inf')?'':`<br>집단이 작을수록(N↓) 반복 집단들이 이론 곡선에서 크게 벗어나고, 선택과 무관하게 대립유전자가 고정(p=1)되거나 사라질(p=0) 수 있습니다.`)+(V(R,'env')==='dark'||V(R,'env')==='light'?'<br>우성 대립유전자 A가 드물 때는 빠르게 늘지만, 열성 대립유전자 a는 드물어지면 대부분 이형접합자(Aa) 속에 숨어 선택을 피하므로 완전히 사라지기까지 아주 오래 걸립니다.':'')})}
  return anim(dt=>{if(run){acc+=dt*V(R,'spd');while(acc>=1){step();acc-=1}}draw()})}});

/* ======================================================================
   생명과학 ③ 신경세포와 활동전위 (호지킨–헉슬리 모형)
   ====================================================================== */
function vtrap(x,y){return Math.abs(x/y)<1e-6?y*(1-x/y/2):x/(Math.exp(x/y)-1)}
const HHr={am:V=>0.1*vtrap(-(V+40),10),bm:V=>4*Math.exp(-(V+65)/18),ah:V=>0.07*Math.exp(-(V+65)/20),bh:V=>1/(1+Math.exp(-(V+35)/10)),an:V=>0.01*vtrap(-(V+55),10),bn:V=>0.125*Math.exp(-(V+65)/80)};
lab({id:'bio-neuron',sub:'biology',icon:'⚡',title:'신경세포와 활동전위 실험실',
 desc:'막전위와 이온 농도를 조절하고 Na⁺, K⁺의 이동에 따른 활동전위 발생 과정을 구현한다.',
 long:'1963년 노벨상을 받은 호지킨–헉슬리 모형 C·dV/dt = I자극 − g_Na m³h(V−E_Na) − g_K n⁴(V−E_K) − g_L(V−E_L)과 개폐 변수 m, h, n의 미분방정식을 0.01 ms 간격 RK4로 풉니다. 평형 전위는 이온 농도와 온도로부터 네른스트 식으로 계산됩니다.',
 art:`<svg viewBox="0 0 300 130" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 95 H110 C125 95 128 20 140 18 C152 16 152 112 165 108 C180 104 190 95 205 95 H280"/><path d="M20 112 H280" stroke-width="1" stroke-dasharray="3 4" stroke-opacity=".6"/></svg>`,
 mount(R){

    ${seg('smode',[['one','단발'],['rep','반복'],['dc','계속']],'one')}<div id="repb">${S('Hz','반복 빈도',5,200,5,50,{unit:'Hz',dec:0})}</div>
    <div class="btns"><button class="p" id="go">⚡ 자극 주기</button><button id="run">⏸</button></div></div>

    ${S('Ko','세포 밖 [K⁺]',2,120,1,20,{dec:0})}${S('Ki','세포 안 [K⁺]',100,500,5,400,{dec:0})}${S('Nao','세포 밖 [Na⁺]',50,600,5,440,{dec:0})}${S('Nai','세포 안 [Na⁺]',5,150,1,50,{dec:0})}

   <div class="c ex"><h4>📐 지금 상황의 계산 과정</h4><div id="ex"></div></div>
  </div></div>`;
  const gm=ctx($('#cm',R)),gv=ctx($('#cv',R)),gg=ctx($('#cg',R)),gi=ctx($('#ci',R)),gNa0=120,gK0=36,gL=0.3,EL=-54.387,Cm=1;
  const P={sq:[20,400,440,50],hk:[60,400,440,50],lna:[20,400,150,50]};
  let y,t=0,hist=[],stim=[],run=true,lastSpike=null,peak=-1e9,pulseEnd=-1,nextRep=0,ions=[];
  const nernst=(o,i,z)=>Rg*(V(R,'T')+273.15)/(z*FAR)*Math.log(o/i)*1000;
  const pars=()=>({ENa:nernst(V(R,'Nao'),V(R,'Nai'),1),EK:nernst(V(R,'Ko'),V(R,'Ki'),1),gNa:V(R,'ttx')?0:gNa0,gK:V(R,'tea')?0:gK0,phi:Math.pow(3,(V(R,'T')-6.3)/10)});
  const inf=(a,b,V0)=>a(V0)/(a(V0)+b(V0));
  function restV(p){// 정상 상태 전류 합 = 0 을 이분법으로 풂
   const f=v=>p.gNa*Math.pow(inf(HHr.am,HHr.bm,v),3)*inf(HHr.ah,HHr.bh,v)*(v-p.ENa)+p.gK*Math.pow(inf(HHr.an,HHr.bn,v),4)*(v-p.EK)+gL*(v-EL);
   const roots=[];let a=-120,fa=f(a);for(let v=-119.5;v<=60;v+=0.5){const fv=f(v);if(fa*fv<=0)roots.push(bisect(f,v-0.5,v,60));fa=fv}return roots.length?roots[0]:NaN}
  function init(){const p=pars(),v=restV(p);y=[isFinite(v)?v:-65,inf(HHr.am,HHr.bm,v),inf(HHr.ah,HHr.bh,v),inf(HHr.an,HHr.bn,v)];hist=[];peak=-1e9}
  init();
  $('#pre',R).oninput=()=>{const q=P[$('#pre',R).value];['Ko','Ki','Nao','Nai'].forEach((k,i)=>setV(R,k,q[i]))};
  wire(R,id=>{$('#repb',R).style.display=segVal(R,'smode')==='rep'?'':'none'});
  onSeg(R,'smode',()=>{$('#repb',R).style.display=segVal(R,'smode')==='rep'?'':'none';nextRep=t});$('#repb',R).style.display='none';
  $('#go',R).onclick=()=>{pulseEnd=t+V(R,'Id')};$('#run',R).onclick=()=>{run=!run;$('#run',R).textContent=run?'⏸':'▶'};
  function Iapp(tt){const m=segVal(R,'smode'),A=V(R,'Ia');if(m==='dc')return A;if(tt<pulseEnd)return A;return 0}
  function deriv(p,I){return (tt,s)=>{const [v,m,h,n]=s,INa=p.gNa*m*m*m*h*(v-p.ENa),IK=p.gK*n*n*n*n*(v-p.EK),IL=gL*(v-EL);
   return [(I-INa-IK-IL)/Cm,p.phi*(HHr.am(v)*(1-m)-HHr.bm(v)*m),p.phi*(HHr.ah(v)*(1-h)-HHr.bh(v)*h),p.phi*(HHr.an(v)*(1-n)-HHr.bn(v)*n)]}}
  function step(dt){const p=pars(),T=dt*V(R,'spd'),h=Math.min(0.01,0.01*3/Math.max(p.phi,1)),n=Math.ceil(T/h),hh=T/n;
   for(let k=0;k<n;k++){if(segVal(R,'smode')==='rep'&&t>=nextRep){pulseEnd=t+V(R,'Id');nextRep=t+1000/V(R,'Hz')}
    const I=Iapp(t),prev=y[0];y=rk4(deriv(p,I),y,t,hh);t+=hh;
    if(y[0]>peak)peak=y[0];if(prev<0&&y[0]>=0){lastSpike={t,peak:y[0]}}if(lastSpike&&y[0]>lastSpike.peak)lastSpike.peak=y[0];
    if(k%5===0){const [v,m,hg,ng]=y;hist.push([t,v,m,hg,ng,p.gNa*m*m*m*hg*(v-p.ENa),p.gK*ng**4*(v-p.EK),gL*(v-EL),I])}}
   while(hist.length&&hist[0][0]<t-50)hist.shift()}
  let tk=0;function draw(){const p=pars(),[v,m,hg,ng]=y,gNa=p.gNa*m**3*hg,gK=p.gK*ng**4,INa=gNa*(v-p.ENa),IK=gK*(v-p.EK);
   // 세포막 그림
   gm.clr();const tx=css('--tx');gm.fillStyle='rgba(59,130,246,.07)';gm.fillRect(0,0,720,70);gm.fillStyle='rgba(239,68,68,.06)';gm.fillRect(0,120,720,70);
   gm.fillStyle=css('--mu');gm.font='12px system-ui';gm.fillText('세포 밖  [Na⁺] '+V(R,'Nao')+'  [K⁺] '+V(R,'Ko')+' mM',10,18);gm.fillText('세포 안  [Na⁺] '+V(R,'Nai')+'  [K⁺] '+V(R,'Ki')+' mM',10,182);
   gm.fillStyle='#fcd34d';gm.fillRect(0,78,720,34);gm.fillStyle='#fbbf24';for(let x=0;x<720;x+=12){gm.beginPath();gm.arc(x+6,80,5,0,7);gm.arc(x+6,110,5,0,7);gm.fill()}
   const chan=(x,frac,open,col,lab)=>{gm.fillStyle=col;gm.fillRect(x-22,72,14,46);gm.fillRect(x+8,72,14,46);gm.fillStyle=css('--card');gm.fillRect(x-8,72,16,46);const o=clamp(open,0,1);gm.fillStyle=col;gm.globalAlpha=.85;gm.fillRect(x-8,92-3,16*(1-o),6);gm.globalAlpha=1;gm.fillStyle=tx;gm.font='11px system-ui';gm.textAlign='center';gm.fillText(lab,x,64);gm.fillText('열린 확률 '+F(frac*100,2)+'%',x,134);gm.textAlign='left'};
   chan(240,p.gNa?m**3*hg:0,p.gNa?m**3*hg/0.35:0,'#ef4444','Na⁺ 통로 (m³h)');chan(480,p.gK?ng**4:0,p.gK?ng**4/0.5:0,'#3b82f6','K⁺ 통로 (n⁴)');
   if(V(R,'ttx')){gm.fillStyle='#111';gm.font='bold 12px system-ui';gm.fillText('TTX',228,90)}if(V(R,'tea')){gm.fillStyle='#111';gm.font='bold 12px system-ui';gm.fillText('TEA',468,90)}
   // 이온 이동 입자 (전류 크기에 비례해 생성)
   const spawn=(cx,I,col,inward)=>{const r=Math.min(6,Math.abs(I)/60);if(Math.random()<r)ions.push({x:cx+(Math.random()-.5)*10,y:inward?40:150,vy:inward?3:-3,col})};
   if(run){spawn(240,INa,'#ef4444',INa<0);spawn(480,IK,'#3b82f6',IK<0)}
   ions=ions.filter(o=>{o.y+=o.vy;gm.fillStyle=o.col;gm.beginPath();gm.arc(o.x,o.y,3.5,0,7);gm.fill();return o.y>-5&&o.y<195});
   gm.fillStyle=tx;gm.font='bold 14px system-ui';gm.fillText('V = '+fx(v,1)+' mV',600,100);
   // 그래프
   const t0=Math.max(0,t-50),t1=Math.max(50,t);gv.clr();
   plot(gv,{x:46,y:8,w:660,h:186},{xr:[t0,t1],yr:[-100,60],xl:'시간 (ms)',yl:'막전위 (mV)',s:[{d:hist.map(q=>[q[0],q[8]?-95+q[8]*0.5:-100]),c:'#f59e0b',w:1.5},{d:hist.map(q=>[q[0],q[1]]),c:'#10b981',w:2.5}],hl:[{y:p.ENa,c:'#ef4444',t:'E_Na'},{y:p.EK,c:'#3b82f6',t:'E_K'},{y:0,c:css('--mu'),dash:[1,3]}]});
   gg.clr();plot(gg,{x:36,y:8,w:310,h:146},{xr:[t0,t1],yr:[0,1],xl:'시간 (ms)',xt:4,s:[{d:hist.map(q=>[q[0],q[2]]),c:'#ef4444'},{d:hist.map(q=>[q[0],q[3]]),c:'#f97316'},{d:hist.map(q=>[q[0],q[4]]),c:'#3b82f6'}]});
   gi.clr();const Im=Math.max(50,...hist.map(q=>Math.max(Math.abs(q[5]),Math.abs(q[6]))))*1.1;plot(gi,{x:44,y:8,w:302,h:146},{xr:[t0,t1],yr:[-Im,Im],xl:'시간 (ms)',yl:'μA/cm²',xt:4,s:[{d:hist.map(q=>[q[0],q[5]]),c:'#ef4444'},{d:hist.map(q=>[q[0],q[6]]),c:'#3b82f6'},{d:hist.map(q=>[q[0],q[7]]),c:'#94a3b8'}],hl:[{y:0,c:css('--mu'),dash:[]}]});
   const vr=restV(p);put(R,'sV',fx(v,2)+' mV');put(R,'sENa',fx(p.ENa,2)+' mV');put(R,'sEK',fx(p.EK,2)+' mV');put(R,'srest',isFinite(vr)?fx(vr,2)+' mV':'—');put(R,'sgNa',F(gNa,3)+' mS/cm²');put(R,'sgK',F(gK,3)+' mS/cm²');put(R,'spk',lastSpike&&t-lastSpike.t<200?fx(lastSpike.peak,1)+' mV':'—');
   if(tk++%10)return;const Tk=V(R,'T')+273.15,kk=Rg*Tk/FAR*1000,mi=inf(HHr.am,HHr.bm,vr),hi=inf(HHr.ah,HHr.bh,vr),ni=inf(HHr.an,HHr.bn,vr),gna=p.gNa*mi**3*hi,gk=p.gK*ni**4;
   const quiet=hist.length>10&&hist.slice(-300).every(q=>Math.abs(q[1]-v)<0.05&&!q[8]);
   explain($('#ex',R),{pre:`T = ${fx(V(R,'T'),1)} ℃ = ${F(Tk,5)} K, RT/F = ${F(kk,4)} mV, 개폐 속도 보정 φ = 3^((T−6.3)/10) = ${F(p.phi,3)}`,
    s:v>-20?'활동전위가 일어나는 중입니다. Na⁺ 통로(m³h)가 열려 Na⁺가 안으로 들어오며 막전위가 E_Na 쪽으로 올라가고(탈분극), 이어서 h가 닫히고 K⁺ 통로(n⁴)가 열려 K⁺가 나가며 재분극됩니다.':'휴지 상태(또는 역치 아래)입니다. 자극이 막전위를 역치(약 −55 mV) 이상으로 올리면 Na⁺ 통로가 양성 되먹임으로 열리며 활동전위가 생깁니다(실무율).',
    f:'네른스트 식 E_ion = (RT/zF)ln([밖]/[안]),  휴지 전위: I_Na + I_K + I_L = 0 → V = (g_Na·E_Na + g_K·E_K + g_L·E_L)/(g_Na + g_K + g_L)  (g = 정상 상태 전도도)',
    c:`E_Na = ${F(kk,4)} × ln(${V(R,'Nao')}/${V(R,'Nai')}) = ${fx(p.ENa,2)} mV,  E_K = ${F(kk,4)} × ln(${V(R,'Ko')}/${V(R,'Ki')}) = ${fx(p.EK,2)} mV,  E_L = ${EL} mV<br>`+
     (isFinite(vr)?`V = ${fx(vr,2)} mV 에서 m∞ = ${F(mi,3)}, h∞ = ${F(hi,3)}, n∞ = ${F(ni,3)} → g_Na = ${p.gNa}·m³h = ${F(gna,3)}, g_K = ${p.gK}·n⁴ = ${F(gk,3)}, g_L = ${gL} mS/cm²<br>V = (${F(gna,3)}×${fx(p.ENa,1)} + ${F(gk,3)}×${fx(p.EK,1)} + ${gL}×${EL}) / (${F(gna,3)} + ${F(gk,3)} + ${gL}) = ${fx((gna*p.ENa+gk*p.EK+gL*EL)/(gna+gk+gL),2)} mV`:'정상 상태 해가 없습니다 (계속 발화).')+
     `<br>지금: I_Na = ${F(gNa,3)} × (${fx(v,1)} − ${fx(p.ENa,1)}) = ${F(INa,3)} μA/cm²,  I_K = ${F(gK,3)} × (${fx(v,1)} − ${fx(p.EK,1)}) = ${F(IK,3)} μA/cm²`,
    r:(quiet&&isFinite(vr)?'휴지 전위 '+cmp(vr,v,' mV',0.002):'자극이 없고 막전위가 안정되면 시뮬레이션 휴지 전위를 이론값과 비교합니다.')+
     `<br>바깥 K⁺를 높이면 E_K가 올라가 휴지 전위가 탈분극되고, 심하면 Na⁺ 통로가 불활성화(h↓)되어 활동전위가 오히려 안 생깁니다. TTX는 활동전위를 없애고, TEA는 재분극을 늦춰 활동전위가 길어집니다.`})}
  return anim(dt=>{if(run)step(dt);draw()})}});

/* ======================================================================
   지구과학 ① 판구조론 및 지각 운동 실험실 (3D 블록 다이어그램)
   ====================================================================== */
// 가상의 지자기 역전 기록 (시드 고정 난수, 평균 극성 지속 0.35 Myr)
const GEOMAG=(()=>{let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const b=[];let x=-80;while(x<30){x+=0.06+(-Math.log(r()))*0.3;b.push(x)}return b})();
function polarity(T){let i=0;while(i<GEOMAG.length&&GEOMAG[i]<T)i++;return (GEOMAG.length-i)%2===0?1:-1}// 현재(20 Myr 이후)의 극성이 정자기

/* ======================================================================
   지구과학 ② 해양 순환 실험실 (스토멜 2상자 모형 + UNESCO 해수 상태 방정식)

/** UNESCO (1981) 해수 밀도, 대기압(표층), T ℃, S psu → kg/m³ */
function rhoSW(T,S){const rw=999.842594+6.793952e-2*T-9.09529e-3*T*T+1.001685e-4*T**3-1.120083e-6*T**4+6.536332e-9*T**5;
 const A=8.24493e-1-4.0899e-3*T+7.6438e-5*T*T-8.2467e-7*T**3+5.3875e-9*T**4,B=-5.72466e-3+1.0227e-4*T-1.6546e-6*T*T,C=4.8314e-4;return rw+A*S+B*Math.pow(S,1.5)+C*S*S}
lab({id:'earth-ocean',sub:'earth',icon:'🌊',title:'해양 순환 실험실',
 desc:'수온과 염분을 조절하여 해수 밀도 차이에 따른 표층·심층 순환을 구현한다.',
 long:'해수 밀도는 UNESCO 국제 해수 상태 방정식으로 계산합니다. 저위도와 고위도 바다를 두 상자로 나눈 스토멜 모형에서 밀도 차이가 순환 세기 q = k(ρ_극 − ρ_적도)를 정하고, 순환은 다시 열과 염분을 날라 밀도 차이를 바꿉니다. 담수가 많이 유입되면 순환이 갑자기 약해지거나 뒤집히는 것을 확인하세요.',
 art:`<svg viewBox="0 0 300 130" fill="none" stroke="#fff" stroke-width="2.5"><rect x="30" y="20" width="240" height="96" rx="6" stroke-opacity=".5"/><path d="M60 40 H230 Q250 40 250 60 V80 Q250 100 230 100 H70 Q50 100 50 80 V60"/><path d="M226 34 l10 6 -10 6 M74 94 l-10 6 10 6" fill="#fff"/></svg>`,
 mount(R){
  R.innerHTML=`<div class="lab"><div class="side">
   <div class="c"><h4>🌡️ 대기 조건 (표층 수온이 따라감)</h4>${S('T1s','저위도 기온',10,32,0.5,25,{unit:'℃',dec:1})}${S('T2s','고위도 기온',-2,15,0.5,2,{unit:'℃',dec:1})}</div>
   <div class="c"><h4>💧 염분 조절</h4>${S('Fw','저위도→고위도 담수 수송 (증발·강수)',0,1.2,0.01,0.3,{unit:'Sv',dec:2})}

    <p class="hint">1 Sv = 10⁶ m³/s. 담수 수송이 클수록 저위도는 짜지고 고위도는 싱거워집니다.</p></div>
   <div class="c"><h4>⏱️ 시간</h4>${S('spd','진행 속도',5,300,5,60,{unit:'년/초',dec:0})}<div class="btns"><button class="p" id="run">⏸</button><button id="rst">↺ 현재 지구 상태로</button></div></div>
  </div><div class="mainc">
   <div class="c">${C('cv',720,300)}</div>
   <div class="c"><div class="stats">${stats([['sq','순환 세기 q'],['sr1','저위도 밀도'],['sr2','고위도 밀도'],['sS1','저위도 염분'],['sS2','고위도 염분'],['sres','물 교환 시간'],['st','경과 시간']])}</div></div>
   <div class="row2"><div class="c"><h4>🧭 수온–염분도 (T–S도)</h4>${C('cts',360,300)}<p class="note">회색 곡선은 같은 밀도선(σ = ρ − 1000). 오른쪽 아래로 갈수록 무거운 물입니다.</p></div>

  </div></div>`;
  const g=ctx($('#cv',R)),gt=ctx($('#cts',R)),gb=ctx($('#cb',R)),gq=ctx($('#cq',R));
  const VOL=1e17,K=5e6,S0=35,GAM=1/1,YR=3.156e7;// 상자 부피 m³, k (m³/s per kg/m³), 온도 복원 1년
  let y,t,hist,run=true,parts=[],bif=null,bifKey='';
  function reset(){y=[25,2,36,34];t=0;hist=[];

   return [GAM*(V(R,'T1s')-T1)+q*(T2-T1)/VOL,GAM*(V(R,'T2s')-T2)+q*(T1-T2)/VOL,(Fw*S0+q*(S2-S1))/VOL,(-Fw*S0+q*(S1-S2))/VOL]}

  $('#melt',R).onclick=()=>{y[3]-=1;y[2]+=1*0;hist.push([t,null])};$('#brine',R).onclick=()=>{y[3]+=0.5};
  function bifur(){// q를 매개변수로 평형 곡선 F(q) 계산
   const T1s=V(R,'T1s'),T2s=V(R,'T2s'),key=T1s+','+T2s;if(key===bifKey)return bif;bifKey=key;const pts=[];
   for(let i=-200;i<=400;i++){const q=i*0.1e6;if(q===0)continue;const c=Math.abs(q)*YR/(VOL*GAM),dT=(T1s-T2s)/(1+2*c),T1=(T1s+T2s+dT)/2,T2=T1-dT;
    const g=dS=>K*(rhoSW(T2,S0-dS/2)-rhoSW(T1,S0+dS/2))-q,dS=bisect(g,-10,20,60);if(dS<-9.9||dS>19.9)continue;const Fw=dS*Math.abs(q)/S0;if(Fw<0)continue;pts.push([Fw/1e6,q/1e6])}
   // 안정성: q>0 가지에서 F가 증가하는 구간(작은 q)은 불안정
   let pk=-1;pts.forEach((p,i)=>{if(p[1]>0&&(pk<0||p[0]>pts[pk][0]))pk=i});const qpk=pts[pk]?pts[pk][1]:0;
   bif={pts,qpk,Fc:pts[pk]?pts[pk][0]:0};return bif}
  function frame(dt){if(run){const Y=dt*V(R,'spd'),n=Math.ceil(Y/0.5),h=Y/n;for(let i=0;i<n;i++){y=rk4(f,y,t,h);t+=h}hist.push([t,qOf(y)/1e6]);while(hist.length>1&&hist[0][0]<t-2000)hist.shift()}draw()}
  let tk=0;function draw(){const [T1,T2,S1,S2]=y,r1=rhoSW(T1,S1),r2=rhoSW(T2,S2),q=K*(r2-r1),qs=q/1e6;

   g.fillStyle=css('--mu');g.font='12px system-ui';g.fillText('적도 쪽',40,30);g.textAlign='right';g.fillText('극 쪽',680,30);g.textAlign='left';g.fillText('☀️ 증발 → 염분 ↑',150,30);g.fillText('🌧️ 강수·융해 → 염분 ↓',470,30);
   // 순환 입자: 사각 고리 경로 (q>0: 표층 극향 → 극 침강 → 심층 적도향 → 적도 용승)

   // T–S도
   gt.clr();const Sx=[32,38],Ty=[-2,32],bx={x:48,y:8,w:298,h:250},tx2=s=>bx.x+bx.w*(s-Sx[0])/(Sx[1]-Sx[0]),ty2=T=>bx.y+bx.h*(1-(T-Ty[0])/(Ty[1]-Ty[0]));

     `<br>이 거리의 원운동 속력 √(GM/r) = ${F(vc,4)} km/s, 탈출 속력 √(2GM/r) = ${F(ve,4)} km/s`,
    r:(isFinite(el.T)?(isFinite(Tmeas)?'주기 '+cmp(el.T,Tmeas,' 년',1e-4):'한 바퀴를 돌면 측정 주기가 표시됩니다.')+(ar.length>2?`<br>면적 속도: 이론 h/2 = ${F(h/2,5)}, 시뮬레이션 구간별 ${F(amin,5)} ~ ${F(amax,5)} AU²/년 → 케플러 제2법칙 ${Math.abs(amax-amin)/(h/2)<1e-3?'<span class="ok">✓ 성립</span>':''}`:''):'쌍곡선 궤도이므로 주기가 없습니다.')+`<br>에너지 보존 오차 |Δε/ε| = ${F(Math.abs((eps-E0)/E0),2)}`})}
  function trueAnom(){const r=Math.hypot(s[0],s[1]),rv=s[0]*s[2]+s[1]*s[3],v2=s[2]*s[2]+s[3]*s[3];const ex=((v2-mu/r)*s[0]-rv*s[2])/mu,ey=((v2-mu/r)*s[1]-rv*s[3])/mu;const w=Math.atan2(ey,ex);let nu=Math.atan2(s[1],s[0])-w;if(el.h<0)nu=-nu;return Math.atan2(s[1],s[0])-w}
  return anim(dt=>{if(run)step(dt);draw()})}});

/* ======================================================================
   수학 ① 수치해석 실험실 (이분법 · 뉴턴–랩슨법 · 할선법)
   ====================================================================== */
const ROOTP=[['x^3 - 2x - 5',[2,3],2,[2,3]],['cos(x) - x',[0,1],1,[0,1]],['x^2 - 2',[1,2],1,[1,2]],['e^x - 3x',[0,1],0,[0,1]],['x^3 - x - 1',[1,2],1.5,[1,2]],['ln(x) + x - 2',[1,2],1,[1,2]],['atan(x)',[-1,2],1.5,[-1,2]]];
lab({id:'math-root',sub:'math',icon:'🎯',title:'수치해석 실험실',
 desc:'이분법, 뉴턴-랩슨법, 할선법을 실행하고 근삿값, 오차, 수렴 속도를 비교한다.',
 long:'방정식 f(x) = 0의 근을 세 가지 반복법으로 찾습니다. 도함수는 입력한 식을 기호 미분해 정확히 구하고, 오차는 고정밀로 구한 기준 근과 비교합니다. 각 방법의 수렴 차수(이분법 1, 할선법 ≈ 1.618, 뉴턴법 2)를 반복 기록에서 직접 추정해 이론과 비교합니다.',
 art:`<svg viewBox="0 0 300 130" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 110 C90 108 150 80 280 10"/><path d="M20 70 H280" stroke-width="1" stroke-opacity=".6"/><path d="M250 26 L150 70 M150 70 V87 L110 70" stroke-dasharray="4 3"/><circle cx="133" cy="70" r="4" fill="#fff"/></svg>`,
 mount(R){
  R.innerHTML=`<div class="lab"><div class="side">
   <div class="c"><h4>📝 방정식 f(x) = 0</h4><select id="pre">${ROOTP.map((p,i)=>`<option value="${i}">${p[0]} = 0</option>`).join('')}<option value="c">직접 입력</option></select>
    <input type="text" id="fx" value="${ROOTP[0][0]}" style="margin-top:8px"><p class="hint" id="fmsg">사용 가능: + − * / ^, sin cos tan exp ln log sqrt abs atan, pi, e</p>
    <p class="hint mono" id="dfx"></p></div>
   <div class="c"><h4>⚙️ 시작값</h4>${S('a','이분법·할선법 구간 a (x₀)',-5,5,0.05,2,{dec:2})}${S('b','이분법·할선법 구간 b (x₁)',-5,5,0.05,3,{dec:2})}${S('x0','뉴턴법 시작값 x₀',-5,5,0.05,2,{dec:2})}
    ${S('tol','허용 오차 (10ⁿ)',-14,-2,1,-10,{log:true})}</div>
   <div class="c"><h4>👀 보기</h4>${seg('m',[['bis','이분법'],['new','뉴턴법'],['sec','할선법']],'new')}
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><button id="prev">◀</button><input type="range" id="k" min="0" max="10" value="1" style="flex:1"><button id="next">▶</button></div><p class="hint" id="kv"></p></div>
  </div><div class="mainc">
   <div class="c">${C('cf',720,320)}</div>
   <div class="c"><div class="stats">${stats([['sr','기준 근 (고정밀)'],['sb','이분법 반복 수'],['sn','뉴턴법 반복 수'],['ss','할선법 반복 수'],['so','추정 수렴 차수 (현재 방법)']])}</div></div>
   <div class="row2"><div class="c"><h4>📉 오차 |xₙ − r|의 감소 (로그 눈금)</h4>${C('ce',360,240)}${legend([['#64748b','이분법'],['#ec4899','뉴턴법'],['#3b82f6','할선법']])}</div>
    <div class="c"><h4>📋 반복 기록</h4><div class="scroll" id="tbl"></div></div></div>
   <div class="c ex"><h4>📐 지금 단계의 계산 과정</h4><div id="ex"></div></div>
  </div></div>`;
  const gf=ctx($('#cf',R)),ge=ctx($('#ce',R));let fn,df,d2f,ast,dast,root,runs,err='';
  function compile(){try{ast=EXPR.parse($('#fx',R).value);dast=EXPR.d(ast,'x');const d2=EXPR.d(dast,'x');fn=x=>EXPR.ev(ast,{x});df=x=>EXPR.ev(dast,{x});d2f=x=>EXPR.ev(d2,{x});err='';put(R,'dfx',"f′(x) = "+EXPR.str(dast));put(R,'fmsg','사용 가능: + − * / ^, sin cos tan exp ln log sqrt abs atan, pi, e')}catch(e){err=e.message;put(R,'fmsg','⚠️ '+e.message)}}
  function refRoot(){const a=V(R,'a'),b=V(R,'b');if(fn(a)*fn(b)<0){let lo=a,hi=b;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(fn(lo)*fn(m)<=0)hi=m;else lo=m}return (lo+hi)/2}
   // 부호 바뀜이 없으면 뉴턴법을 오래 돌려 기준값으로
   let x=V(R,'x0');for(let i=0;i<200;i++){const d=df(x);if(!d)break;x-=fn(x)/d}return x}
  function run(){const tol=V(R,'tol'),N=60,out={bis:[],new:[],sec:[]};
   let a=V(R,'a'),b=V(R,'b');if(fn(a)*fn(b)<0){for(let i=0;i<N;i++){const c=(a+b)/2,fc=fn(c);out.bis.push({a,b,x:c,f:fc});if(Math.abs(b-a)/2<tol||fc===0)break;if(fn(a)*fc<0)b=c;else a=c}}else out.bisErr=true;
   let x=V(R,'x0');for(let i=0;i<N;i++){const f=fn(x),d=df(x);out.new.push({x,f,d});if(!isFinite(x)||!d){out.newErr=true;break}const nx=x-f/d;if(Math.abs(nx-x)<tol){out.new.push({x:nx,f:fn(nx),d:df(nx)});break}x=nx}
   let x0=V(R,'a'),x1=V(R,'b');out.sec.push({x:x0,f:fn(x0)});for(let i=0;i<N;i++){const f0=fn(x0),f1=fn(x1);out.sec.push({x:x1,f:f1,xp:x0,fp:f0});if(f1===f0)break;const nx=x1-f1*(x1-x0)/(f1-f0);if(Math.abs(nx-x1)<tol){out.sec.push({x:nx,f:fn(nx),xp:x1,fp:f1});break}x0=x1;x1=nx;if(!isFinite(x1))break}
   return out}
  function order(e){// 연속 오차 3개로 p 추정: p ≈ ln(e₂/e₁)/ln(e₁/e₀)
   const ps=[];for(let i=2;i<e.length;i++){const [e0,e1,e2]=[e[i-2],e[i-1],e[i]];if(e2>1e-13&&e1>1e-13&&e0>0&&e1<e0&&e2<e1)ps.push(Math.log(e2/e1)/Math.log(e1/e0))}if(!ps.length)return NaN;ps.sort((a,b)=>a-b);return ps[Math.floor(ps.length/2)]}
  function bisRate(e){const v=e.filter(x=>x>1e-15);if(v.length<3)return NaN;return Math.pow(v[v.length-1]/v[0],1/(v.length-1))}
  function recompute(){compile();if(err)return;root=refRoot();runs=run();const m=segVal(R,'m'),L=runs[m].length;$('#k',R).max=Math.max(1,L-1);if(+$('#k',R).value>L-1)$('#k',R).value=L-1;draw()}
  $('#pre',R).oninput=()=>{const v=$('#pre',R).value;if(v==='c')return;const p=ROOTP[+v];$('#fx',R).value=p[0];setV(R,'a',p[1][0]);setV(R,'b',p[1][1]);setV(R,'x0',p[2]);recompute()};
  $('#fx',R).addEventListener('input',()=>{$('#pre',R).value='c';recompute()});
  wire($('.side',R),id=>{if(id==='k')draw();else if(['a','b','x0','tol'].includes(id))recompute()});
  onSeg(R,'m',()=>{$('#k',R).value=1;recompute()});
  $('#prev',R).onclick=()=>{$('#k',R).value=Math.max(0,+$('#k',R).value-1);draw()};$('#next',R).onclick=()=>{$('#k',R).value=+$('#k',R).value+1;draw()};
  function draw(){if(err)return;const m=segVal(R,'m'),it=runs[m],k=+$('#k',R).value,e=q=>Math.abs(q.x-root);
   // 그래프 범위
   const xs=[V(R,'a'),V(R,'b'),V(R,'x0'),root,...it.slice(0,Math.max(k+1,2)).map(q=>q.x).filter(isFinite)];let xa=Math.min(...xs),xb=Math.max(...xs);const pad=(xb-xa)*0.25+0.3;xa-=pad;xb+=pad;
   const d=[];let ya=Infinity,yb=-Infinity;for(let i=0;i<=400;i++){const x=xa+(xb-xa)*i/400,y=fn(x);d.push([x,y]);if(isFinite(y)){ya=Math.min(ya,y);yb=Math.max(yb,y)}}
   const yr=Math.max(Math.abs(ya),Math.abs(yb));ya=Math.max(ya,-yr)*1.1;yb=yb*1.1;if(ya>-0.1*yr)ya=-0.15*yr;if(yb<0.1*yr)yb=0.15*yr;
   gf.clr();const box={x:50,y:10,w:650,h:270};const T=plot(gf,box,{xr:[xa,xb],yr:[ya,yb],xl:'x',yl:'f(x)',s:[{d,c:'#ec4899',w:2.5}],hl:[{y:0,c:css('--tx'),dash:[]}],vl:[{x:root,c:'#10b981',t:'근'}]});
   gf.save();gf.beginPath();gf.rect(box.x,box.y,box.w,box.h);gf.clip();gf.lineWidth=1.5;
   if(m==='bis'&&it.length){const q=it[Math.min(k,it.length-1)];gf.fillStyle='rgba(100,116,139,.18)';gf.fillRect(T.tx(q.a),box.y,T.tx(q.b)-T.tx(q.a),box.h);
    for(let i=0;i<=Math.min(k,it.length-1);i++){gf.fillStyle=i===k?'#ef4444':'#64748b';gf.beginPath();gf.arc(T.tx(it[i].x),T.ty(0),i===k?5:3,0,7);gf.fill()}}
   if(m==='new'){for(let i=0;i<Math.min(k,it.length-1);i++){const q=it[i],nx=it[i+1].x;gf.strokeStyle=i===k-1?'#ef4444':'rgba(100,116,139,.6)';gf.setLineDash([5,3]);gf.beginPath();gf.moveTo(T.tx(q.x),T.ty(0));gf.lineTo(T.tx(q.x),T.ty(q.f));gf.stroke();gf.setLineDash([]);gf.beginPath();gf.moveTo(T.tx(q.x),T.ty(q.f));gf.lineTo(T.tx(nx),T.ty(0));gf.stroke()}
    it.slice(0,k+1).forEach((q,i)=>{gf.fillStyle=i===k?'#ef4444':'#64748b';gf.beginPath();gf.arc(T.tx(q.x),T.ty(0),i===k?5:3,0,7);gf.fill()})}
   if(m==='sec'){for(let i=1;i<Math.min(k+1,it.length);i++){const q=it[i];if(q.xp===undefined)continue;gf.strokeStyle=i===k?'#ef4444':'rgba(100,116,139,.6)';const nx=it[i+1]?it[i+1].x:q.x;gf.beginPath();gf.moveTo(T.tx(q.xp),T.ty(q.fp));gf.lineTo(T.tx(nx),T.ty(0));gf.stroke()}
    it.slice(0,k+1).forEach((q,i)=>{gf.fillStyle=i===k?'#ef4444':'#64748b';gf.beginPath();gf.arc(T.tx(q.x),T.ty(0),i===k?5:3,0,7);gf.fill()})}
   gf.restore();
   // 오차 그래프
   ge.clr();const se=[['bis','#64748b'],['new','#ec4899'],['sec','#3b82f6']].map(([mm,c])=>({d:runs[mm].map((q,i)=>[i,Math.max(e(q),1e-17)]),c,w:mm===m?3:1.6}));const nmax=Math.max(5,...Object.values(runs).filter(Array.isArray).map(a=>a.length));
   plot(ge,{x:44,y:8,w:302,h:196},{xr:[0,nmax],yr:[-17,1],logy:true,xl:'반복 횟수 n',xt:5,s:se,hl:[{y:V(R,'tol'),c:css('--mu'),t:'허용 오차'}]});
   // 표
   const p=order(it.map(e));
   $('#tbl',R).innerHTML=`<table class="t"><tr><th>n</th><th>xₙ</th><th>f(xₙ)</th><th>|xₙ − r|</th>${m==='bis'?'<th>[a, b]</th>':''}</tr>${it.map((q,i)=>`<tr style="${i===k?'background:color-mix(in srgb,var(--sub) 15%,transparent)':''}"><td>${i}</td><td class="mono">${q.x.toPrecision(15)}</td><td>${F(q.f,3)}</td><td>${F(e(q),3)}</td>${m==='bis'?`<td>[${F(q.a,6)}, ${F(q.b,6)}]</td>`:''}</tr>`).join('')}</table>`;
   put(R,'sr',root.toPrecision(13));put(R,'sb',runs.bisErr?'부호 변화 없음':runs.bis.length+'회');put(R,'sn',runs.newErr?'실패':runs.new.length-1+'회');put(R,'ss',runs.sec.length-2+'회');put(R,'so',m==='bis'?'1 (감소율 '+F(bisRate(it.map(e)),3)+')':isFinite(p)?F(p,3):'—');
   put(R,'kv',`${k}단계 (전체 ${it.length-1}단계)`);
   // 계산 과정
   const q=it[Math.min(k,it.length-1)],r=root,fp=df(r),fpp=d2f(r),C=Math.abs(fpp/(2*fp));
   if(m==='bis'){if(runs.bisErr){explain($('#ex',R),{s:'f(a)와 f(b)의 부호가 같아 이분법을 쓸 수 없습니다.',f:'중간값 정리: f(a)·f(b) < 0 이면 (a, b) 안에 근이 있음',c:`f(${V(R,'a')}) = ${F(fn(V(R,'a')),4)}, f(${V(R,'b')}) = ${F(fn(V(R,'b')),4)}`,r:'구간 a, b를 근을 사이에 두도록 바꿔 보세요.'});return}
    const n=Math.ceil(Math.log2((V(R,'b')-V(R,'a'))/V(R,'tol')))-1;
    explain($('#ex',R),{pre:`${k}단계: 구간 [${F(q.a,8)}, ${F(q.b,8)}]`,s:'근이 들어 있는 구간을 매번 반으로 줄입니다. 항상 수렴하지만 느립니다(1차 수렴, 오차가 매번 약 ½배).',
     f:'c = (a + b)/2,  f(a)·f(c) < 0 이면 b ← c, 아니면 a ← c,  오차 한계 |c − r| ≤ (b₀ − a₀)/2ⁿ⁺¹',
     c:`c = (${F(q.a,8)} + ${F(q.b,8)})/2 = ${F(q.x,10)},  f(c) = ${F(q.f,4)} → ${fn(q.a)*q.f<0?'b ← c':'a ← c'}<br>오차 한계 = ${F(V(R,'b')-V(R,'a'),4)}/2^${k+1} = ${F((V(R,'b')-V(R,'a'))/Math.pow(2,k+1),4)}, 실제 오차 = ${F(e(q),4)}<br>허용 오차 ${F(V(R,'tol'),2)}에 필요한 반복 수 n ≥ log₂((b−a)/tol) − 1 = ${n+1}`,
     r:`실제 오차가 오차 한계 이하 ${e(q)<=(V(R,'b')-V(R,'a'))/Math.pow(2,k+1)+1e-15?'<span class="ok">✓</span>':''} · 이분법의 오차는 들쭉날쭉하지만 평균적으로 매 단계 ${F(bisRate(it.map(e)),3)}배로 줄어듭니다 (이론 0.5, 1차 수렴)`})}
   if(m==='new'){const nq=it[Math.min(k+1,it.length-1)];const ratio=k>0&&e(it[k-1])>0?e(q)/e(it[k-1])**2:NaN;
    explain($('#ex',R),{pre:`f′(x) = ${EXPR.str(dast)}`,s:'현재 점에서 그은 접선이 x축과 만나는 곳을 다음 근삿값으로 삼습니다. 근 근처에서는 오차가 이전 오차의 제곱에 비례해 줄어(2차 수렴) 맞는 자릿수가 매번 약 2배가 됩니다.',
     f:'xₙ₊₁ = xₙ − f(xₙ)/f′(xₙ),  eₙ₊₁ ≈ C·eₙ²,  C = |f″(r) / (2f′(r))|',
     c:`x${sub(k)} = ${F(q.x,12)}, f = ${F(q.f,5)}, f′ = ${F(q.d,5)}<br>x${sub(k+1)} = ${F(q.x,10)} − (${F(q.f,5)})/(${F(q.d,5)}) = ${F(nq.x,13)}<br>근에서 f′(r) = ${F(fp,5)}, f″(r) = ${F(fpp,5)} → C = ${F(C,4)}`+(isFinite(ratio)&&e(q)>1e-13?`<br>eₙ/eₙ₋₁² = ${F(e(q),3)} / (${F(e(it[k-1]),3)})² = ${F(ratio,4)}`:''),
     r:(isFinite(ratio)&&e(q)>1e-13&&e(it[k-1])<0.1?'오차 상수 '+cmp(C,ratio,'',0.15)+'<br>':'')+`추정 수렴 차수 p ≈ ${F(p,3)} (이론 2)`+(Math.abs(fp)<1e-6?'<br>⚠️ f′(r) ≈ 0 (중근)이면 뉴턴법도 1차로 느려집니다.':'')})}
   if(m==='sec'){const nq=it[Math.min(k+1,it.length-1)];const phi=(1+Math.sqrt(5))/2;
    explain($('#ex',R),{s:'최근 두 점을 잇는 직선(할선)이 x축과 만나는 곳을 다음 근삿값으로 삼습니다. 도함수가 필요 없고, 수렴 차수는 황금비 φ ≈ 1.618입니다.',
     f:'xₙ₊₁ = xₙ − f(xₙ)(xₙ − xₙ₋₁)/(f(xₙ) − f(xₙ₋₁)),  eₙ₊₁ ≈ C^(0.618)·eₙ^φ',
     c:q.xp!==undefined?`xₙ₋₁ = ${F(q.xp,10)}, f = ${F(q.fp,5)}; xₙ = ${F(q.x,10)}, f = ${F(q.f,5)}<br>xₙ₊₁ = ${F(q.x,10)} − ${F(q.f,5)}×(${F(q.x-q.xp,5)})/(${F(q.f-q.fp,5)}) = ${F(nq.x,13)}`:'시작값 두 개 x₀ = a, x₁ = b',
     r:`추정 수렴 차수 p ≈ ${F(p,3)} (이론 φ = ${F(phi,4)})`})}}
  const sub=n=>String(n).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[c]).join('');
  recompute();}});

/* ======================================================================
   수학 ② 공간도형 및 곡면 탐험실
   ====================================================================== */
const QD={sph:['구 x² + y² + z² = a²',[1,1,1,0,-1],'ell'],ell:['타원면 x²/a² + y²/b² + z²/c² = 1',[1,1,1,0,-1],'ell'],h1:['한 장 쌍곡면 x²/a² + y²/b² − z²/c² = 1',[1,1,-1,0,-1],'h1'],h2:['두 장 쌍곡면 −x²/a² − y²/b² + z²/c² = 1',[-1,-1,1,0,-1],'h2'],
 cone:['타원뿔 x²/a² + y²/b² = z²/c²',[1,1,-1,0,0],'cone'],ep:['타원 포물면 z/c = x²/a² + y²/b²',[1,1,0,-1,0],'ep'],hp:['쌍곡 포물면 z/c = x²/a² − y²/b²',[1,-1,0,-1,0],'hp'],cyl:['타원기둥 x²/a² + y²/b² = 1',[1,1,0,0,-1],'cyl'],custom:['직접 입력 z = f(x, y)',null,'custom']};
lab({id:'math-surface',sub:'math',icon:'🧊',title:'공간도형 및 곡면 탐험실',
 desc:'곡면의 방정식을 변경하고 3D 그래프와 평면 단면의 교선 변화를 관찰한다.',
 long:'이차곡면을 3D로 그리고, 좌표평면에 평행한 평면으로 자른 교선을 구합니다. 교선의 방정식은 평면 식을 곡면 식에 대입해 완전제곱식으로 정리해 원·타원·쌍곡선·포물선·직선으로 분류하며, 화면의 교선은 마칭 스퀘어 알고리즘으로 수치적으로 찾습니다. 타원 단면은 넓이를 수치 적분해 πab와 비교합니다.',
 art:`<svg viewBox="0 0 300 130" fill="none" stroke="#fff" stroke-width="2.5"><path d="M90 20 Q150 70 210 20 M90 110 Q150 60 210 110"/><ellipse cx="150" cy="65" rx="34" ry="9"/><path d="M70 55 L230 55 L250 78 L90 78 Z" stroke-opacity=".5"/></svg>`,
 mount(R){
  R.innerHTML=`<div class="lab"><div class="side">
   <div class="c"><h4>🧊 곡면</h4><select id="ty">${Object.entries(QD).map(([k,v])=>`<option value="${k}" ${k==='h1'?'selected':''}>${v[0]}</option>`).join('')}</select>
    <div id="cust" style="display:none"><input type="text" id="fxy" value="sin(x)·cos(y)" style="margin-top:8px"><p class="hint" id="cmsg"></p></div>
    <div id="abc">${S('a','a',0.3,3,0.05,1,{dec:2})}${S('b','b',0.3,3,0.05,1,{dec:2})}${S('c','c',0.3,3,0.05,1,{dec:2})}</div></div>
   <div class="c"><h4>✂️ 자르는 평면</h4>${seg('pl',[['z','z = k'],['x','x = k'],['y','y = k']],'z')}${S('k','k',-2.9,2.9,0.01,0.8,{dec:2})}
    <div class="btns"><button id="anim">▶ k 움직이기</button></div></div>
   <div class="c"><h4>👀 보기</h4><label class="chk"><input type="checkbox" id="wire" checked> 격자선</label><label class="chk"><input type="checkbox" id="plane" checked> 평면 표시</label><p class="hint">끌어서 회전 · 휠로 확대</p></div>
  </div><div class="mainc">
   <div class="row2"><div class="c">${C('c3',360,360)}</div><div class="c"><h4 id="t2">단면</h4>${C('c2',360,324)}</div></div>
   <div class="c"><div class="stats">${stats([['scl','교선의 종류'],['seq','교선의 방정식'],['sA','넓이 (이론)'],['sAn','넓이 (수치)']])}</div></div>
   <div class="c ex"><h4>📐 지금 상황의 계산 과정</h4><div id="ex"></div></div>
  </div></div>`;
  const c3=$('#c3',R),g=ctx(c3),g2=ctx($('#c2',R)),L=3;let anim1=false,dirty=true,cf=null;
  const vw=view3d(c3,{yaw:-0.6,pitch:0.4,s:52,cy:185,dist:14,on:()=>dirty=true});
  wire(R,id=>{const ty=V(R,'ty');$('#cust',R).style.display=ty==='custom'?'':'none';$('#abc',R).style.display=ty==='custom'?'none':'';if(ty==='sph'){setV(R,'b',V(R,'a'));setV(R,'c',V(R,'a'))}dirty=true});
  onSeg(R,'pl',()=>dirty=true);$('#anim',R).onclick=()=>{anim1=!anim1;$('#anim',R).textContent=anim1?'⏸ 멈춤':'▶ k 움직이기'};
  function coef(){const ty=V(R,'ty');let a=V(R,'a'),b=V(R,'b'),c=V(R,'c');if(ty==='sph'){b=a;c=a}const s=QD[ty][1]||[0,0,0,0,0];
   return {p:s[0]/(a*a),q:s[1]/(b*b),r:s[2]/(c*c),s:s[3]/c,t:s[4],a,b,c}}
  function Ffun(){const ty=V(R,'ty');if(ty==='custom'){try{const e=EXPR.compile($('#fxy',R).value,['x','y']);put(R,'cmsg','');cf=e;return (x,y,z)=>e.f(x,y)-z}catch(er){put(R,'cmsg','⚠️ '+er.message);return null}}
   const k=coef();return (x,y,z)=>k.p*x*x+k.q*y*y+k.r*z*z+k.s*z+k.t}
  function mesh(){const ty=V(R,'ty'),{a,b,c}=coef(),F=[],N=36,M=24,ok=p=>Math.abs(p[0])<=L*1.001&&Math.abs(p[1])<=L*1.001&&Math.abs(p[2])<=L*1.001;
   const par=(f,u0,u1,v0,v1,col)=>{for(let i=0;i<N;i++)for(let j=0;j<M;j++){const u=[u0+(u1-u0)*i/N,u0+(u1-u0)*(i+1)/N],v=[v0+(v1-v0)*j/M,v0+(v1-v0)*(j+1)/M],P=[f(u[0],v[0]),f(u[1],v[0]),f(u[1],v[1]),f(u[0],v[1])];if(P.every(ok))F.push({p:P,c:col,a:.92,st:V(R,'wire')?'rgba(255,255,255,.25)':null})}};
   const C1=[236,72,153],C2=[99,102,241],th=[0,2*Math.PI];
   if(ty==='sph'||ty==='ell')par((u,v)=>[a*Math.sin(v)*Math.cos(u),b*Math.sin(v)*Math.sin(u),c*Math.cos(v)],...th,0,Math.PI,C1);
   if(ty==='h1'){const U=Math.asinh(L/c);par((u,v)=>[a*Math.cosh(v)*Math.cos(u),b*Math.cosh(v)*Math.sin(u),c*Math.sinh(v)],...th,-U,U,C1)}
   if(ty==='h2'&&L>c){const U=Math.acosh(L/c);par((u,v)=>[a*Math.sinh(v)*Math.cos(u),b*Math.sinh(v)*Math.sin(u),c*Math.cosh(v)],...th,0,U,C1);par((u,v)=>[a*Math.sinh(v)*Math.cos(u),b*Math.sinh(v)*Math.sin(u),-c*Math.cosh(v)],...th,0,U,C2)}
   if(ty==='cone'){par((u,v)=>[a*v*Math.cos(u),b*v*Math.sin(u),c*v],...th,0,L/c,C1);par((u,v)=>[a*v*Math.cos(u),b*v*Math.sin(u),c*v],...th,-L/c,0,C2)}
   if(ty==='ep')par((u,v)=>[a*v*Math.cos(u),b*v*Math.sin(u),c*v*v],...th,0,Math.sqrt(L/c),C1);
   if(ty==='cyl')par((u,v)=>[a*Math.cos(u),b*Math.sin(u),v],...th,-L,L,C1);
   if(ty==='hp')par((x,y)=>[x,y,c*(x*x/(a*a)-y*y/(b*b))],-L,L,-L,L,C1);
   if(ty==='custom'&&cf)par((x,y)=>[x,y,cf.f(x,y)],-L,L,-L,L,C1);
   return F}
  /** 마칭 스퀘어: 평면 위 (u,v) 격자에서 G(u,v)=0 선분 */
  function march(G,n=140,sg=1){const segs=[],h=2*L/n,val=[];for(let i=0;i<=n;i++){val.push([]);for(let j=0;j<=n;j++)val[i].push(G(-L+i*h,-L+j*h))}
   let inside=0;
   for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v0=val[i][j],v1=val[i+1][j],v2=val[i+1][j+1],v3=val[i][j+1],u=-L+i*h,w=-L+j*h;
    if(sg*(v0+v1+v2+v3)/4<0)inside++;
    const P=[],e=(va,vb,pa,pb)=>{if((va<0)!==(vb<0)){const t=va/(va-vb);P.push([pa[0]+(pb[0]-pa[0])*t,pa[1]+(pb[1]-pa[1])*t])}};
    e(v0,v1,[u,w],[u+h,w]);e(v1,v2,[u+h,w],[u+h,w+h]);e(v2,v3,[u+h,w+h],[u,w+h]);e(v3,v0,[u,w+h],[u,w]);
    if(P.length===2)segs.push(P);else if(P.length===4){segs.push([P[0],P[1]]);segs.push([P[2],P[3]])}}
   return {segs,area:inside*h*h}}
  function conic(){// 평면 대입 → A u² + B v² + D v + E = 0
   const k=V(R,'k'),pl=segVal(R,'pl'),q=coef();let A,B,D,E,u,v;
   if(pl==='z'){A=q.p;B=q.q;D=0;E=q.r*k*k+q.s*k+q.t;u='x';v='y'}else if(pl==='x'){A=q.q;B=q.r;D=q.s;E=q.p*k*k+q.t;u='y';v='z'}else{A=q.p;B=q.r;D=q.s;E=q.q*k*k+q.t;u='x';v='z'}
   const res={A,B,D,E,u,v};const z=x=>Math.abs(x)<1e-12;
   if(!z(B)){const v0=-D/(2*B),E2=E-D*D/(4*B);res.v0=v0;res.E2=E2;const vs=z(v0)?v:`(${v} ${v0>0?'−':'+'} ${F(Math.abs(v0),4)})`;
    if(!z(A)){if(A*B>0){if(E2*A<0&&!z(E2)){const al=Math.sqrt(-E2/A),be=Math.sqrt(-E2/B);res.type=Math.abs(al-be)<1e-9?'원':'타원';res.eq=`${u}²/${F(al,4)}² + ${vs}²/${F(be,4)}² = 1`;res.area=Math.PI*al*be;res.al=al;res.be=be}else if(z(E2)){res.type='한 점';res.eq=`${u} = 0, ${v} = ${F(v0,4)}`}else{res.type='교선 없음';res.eq='실수해 없음'}}
     else{if(z(E2)){res.type='만나는 두 직선';res.eq=`${vs} = ±${F(Math.sqrt(-A/B),4)}·${u}`}else{const al=Math.sqrt(Math.abs(E2/A)),be=Math.sqrt(Math.abs(E2/B));res.type='쌍곡선';res.eq=(-E2/A>0)?`${u}²/${F(al,4)}² − ${vs}²/${F(be,4)}² = 1`:`${vs}²/${F(be,4)}² − ${u}²/${F(al,4)}² = 1`;res.slope=Math.sqrt(Math.abs(A/B))}}}
    else{const w=-E2/B;if(w>1e-12){res.type='평행한 두 직선';res.eq=`${v} = ${F(v0+Math.sqrt(w),4)}, ${v} = ${F(v0-Math.sqrt(w),4)}`}else if(z(w)){res.type='한 직선';res.eq=`${v} = ${F(v0,4)}`}else{res.type='교선 없음';res.eq='실수해 없음'}}}
   else{if(!z(D)){if(!z(A)){res.type='포물선';const cA=-A/D,cs=Math.abs(cA-1)<1e-12?'':Math.abs(cA+1)<1e-12?'−':F(cA,4);res.eq=`${v} = ${cs}${u}²`+(Math.abs(E/D)>1e-12?` ${-E/D>=0?'+':'−'} ${F(Math.abs(E/D),4)}`:'');res.focal=Math.abs(D/A)/4}else{res.type='직선';res.eq=`${v} = ${F(-E/D,4)}`}}
    else if(!z(A)){const w=-E/A;if(w>1e-12){res.type='평행한 두 직선';res.eq=`${u} = ±${F(Math.sqrt(w),4)}`}else if(z(w)){res.type='한 직선';res.eq=`${u} = 0`}else{res.type='교선 없음';res.eq='실수해 없음'}}else{res.type=z(E)?'평면 전체':'교선 없음';res.eq=''}}
   return res}
  function draw(){const Fx=Ffun();if(!Fx)return;const k=V(R,'k'),pl=segVal(R,'pl');
   const G=pl==='z'?(u,v)=>Fx(u,v,k):pl==='x'?(u,v)=>Fx(k,u,v):(u,v)=>Fx(u,k,v),to3=pl==='z'?(u,v)=>[u,v,k]:pl==='x'?(u,v)=>[k,u,v]:(u,v)=>[u,k,v];
   const ty0=V(R,'ty'),mc=march(G,140,ty0==='custom'?1:Math.sign(conic().A)||1);g.clr();
   // 축
   const ax=(p,q,c,l)=>{vw.line(g,[p,q],c,1.2);const e=vw.p(...q);g.fillStyle=c;g.font='bold 12px system-ui';g.fillText(l,e[0]+3,e[1])};
   const faces=mesh();
   if(V(R,'plane')){const P=[to3(-L,-L),to3(L,-L),to3(L,L),to3(-L,L)];faces.push({p:P,c:[250,204,21],a:.28,flat:1,st:'rgba(202,138,4,.8)'})}
   vw.faces(g,faces,[-.4,-.6,.8]);ax([-L,0,0],[L+.4,0,0],'#ef4444','x');ax([0,-L,0],[0,L+.4,0],'#10b981','y');ax([0,0,-L],[0,0,L+.4],'#3b82f6','z');
   g.strokeStyle='#facc15';g.lineWidth=3.5;g.lineCap='round';for(const s of mc.segs){const a=vw.p(...to3(...s[0])),b=vw.p(...to3(...s[1]));g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}g.lineCap='butt';
   // 2D 단면
   const un=pl==='x'?'y':'x',vn=pl==='z'?'y':'z';put(R,'t2',`단면 ${pl} = ${fx(k,2)} (가로 ${un}, 세로 ${vn})`);
   g2.clr();const T=plot(g2,{x:34,y:8,w:310,h:290},{xr:[-L,L],yr:[-L,L],xl:un,xt:6,s:[]});g2.save();g2.beginPath();g2.rect(34,8,310,290);g2.clip();
   g2.strokeStyle='#eab308';g2.lineWidth=2.5;for(const s of mc.segs){g2.beginPath();g2.moveTo(T.tx(s[0][0]),T.ty(s[0][1]));g2.lineTo(T.tx(s[1][0]),T.ty(s[1][1]));g2.stroke()}
   const ty=V(R,'ty');let cn=null;if(ty!=='custom'){cn=conic();if(cn.type==='쌍곡선'&&cn.slope){g2.strokeStyle=css('--mu');g2.setLineDash([4,4]);g2.lineWidth=1;const v0=cn.v0||0;for(const sg of [1,-1]){g2.beginPath();g2.moveTo(T.tx(-L),T.ty(v0-sg*cn.slope*L));g2.lineTo(T.tx(L),T.ty(v0+sg*cn.slope*L));g2.stroke()}g2.setLineDash([])}}
   g2.restore();g2.fillStyle=css('--mu');g2.font='11px system-ui';g2.fillText(vn,8,16);
   if(ty==='custom'){const s=$('#fxy',R).value;put(R,'scl','곡선 (등고선)');put(R,'seq',pl==='z'?`${s} = ${fx(k,2)}`:pl==='x'?`z = f(${fx(k,2)}, y)`:`z = f(x, ${fx(k,2)})`);put(R,'sA','—');put(R,'sAn','—');
    explain($('#ex',R),{s:'곡면 z = f(x, y)를 평면으로 자릅니다.',f:pl==='z'?'z = k 단면 → f(x, y) = k (등고선)':pl==='x'?'x = k 단면 → z = f(k, y) (한 변수 함수의 그래프)':'y = k 단면 → z = f(x, k)',c:`f(x, y) = ${s}, k = ${fx(k,2)}<br>격자 140×140에서 F = f − z 의 부호가 바뀌는 칸을 찾아 선분 ${mc.segs.length}개로 교선을 그렸습니다.`,r:'z = k를 움직이면 지도의 등고선처럼 곡면의 높이 분포를 볼 수 있습니다.'});return}
   const q=coef();put(R,'scl',cn.type);put(R,'seq',cn.eq||'—');const tight=cn.area&&cn.al<L&&cn.be<L&&Math.abs((cn.v0||0))+cn.be<L;put(R,'sA',cn.area?F(cn.area,5):'—');put(R,'sAn',cn.area&&tight?F(mc.area,5):'—');
   const subst=pl==='z'?`${F(q.p,4)}x² + ${F(q.q,4)}y² + ${F(q.r,4)}(${fx(k,2)})² ${q.s?`+ ${F(q.s,4)}(${fx(k,2)})`:''} ${q.t?`− ${F(-q.t,4)}`:''} = 0`:pl==='x'?`${F(q.p,4)}(${fx(k,2)})² + ${F(q.q,4)}y² + ${F(q.r,4)}z² ${q.s?`+ ${F(q.s,4)}z`:''} ${q.t?`− ${F(-q.t,4)}`:''} = 0`:`${F(q.p,4)}x² + ${F(q.q,4)}(${fx(k,2)})² + ${F(q.r,4)}z² ${q.s?`+ ${F(q.s,4)}z`:''} ${q.t?`− ${F(-q.t,4)}`:''} = 0`;
   explain($('#ex',R),{pre:`${QD[ty][0]},  a = ${F(q.a,3)}, b = ${F(q.b,3)}, c = ${F(q.c,3)}`,s:`평면 ${pl} = ${fx(k,2)}로 자른 단면은 <b>${cn.type}</b>입니다.`,
    f:'평면의 식을 곡면의 식에 대입 → A·u² + B·v² + D·v + E = 0 → v에 대해 완전제곱식으로 정리 → A, B의 부호와 상수항으로 분류 (같은 부호: 타원, 다른 부호: 쌍곡선, 한쪽이 0: 포물선/직선)',
    c:`대입: ${subst}<br>A = ${F(cn.A,4)}, B = ${F(cn.B,4)}, D = ${F(cn.D,4)}, E = ${F(cn.E,4)}`+(cn.E2!==undefined&&cn.D?`<br>완전제곱: B(v + D/2B)² + A·u² + (E − D²/4B) = 0, 상수항 ${F(cn.E2,4)}`:'')+`<br>→ ${cn.eq}`+(cn.area?`<br>타원 넓이 = π × ${F(cn.al,4)} × ${F(cn.be,4)} = ${F(cn.area,6)}`:'')+(cn.slope?`<br>점근선 기울기 ±√|A/B| = ±${F(cn.slope,4)}`:'')+(cn.focal?`<br>포물선의 꼭짓점–초점 거리 = |D/A|/4 = ${F(cn.focal,4)}`:''),
    r:cn.area&&tight?'넓이 '+cmp(cn.area,mc.area,'',0.01)+' (수치값: 격자 칸 중심의 부호로 셈)':(cn.type==='타원'||cn.type==='원'?'단면이 화면 밖으로 나가 넓이를 수치로 셀 수 없습니다.':`k를 바꾸면 단면의 종류가 바뀌는 지점을 찾아보세요.${ty==='h1'?' 한 장 쌍곡면을 x = ±a 로 자르면 두 직선이 됩니다(직선으로 이루어진 곡면).':ty==='cone'?' 원뿔을 꼭짓점을 지나게 자르면 두 직선이 됩니다.':''}`)})}
  return anim(dt=>{if(anim1){let k=V(R,'k')+dt*0.6;if(k>2.9)k=-2.9;setV(R,'k',k);dirty=true}if(dirty){dirty=false;draw()}})}});

/* ======================================================================
   수학 ③ 미분방정식 및 동역학 실험실
   ====================================================================== */
const ODE1={exp:{n:"y′ = k·y (지수 성장·감쇠)",p:[['k','k',-1.5,1.5,0.05,0.5]],f:(t,y,P)=>P.k*y,ex:(t,t0,y0,P)=>y0*Math.exp(P.k*(t-t0)),eqf:'y(t) = y₀e^{k(t−t₀)}',yr:[-4,4]},

   for(const [a,c] of curves){const tr=traj(a,c,30);g.strokeStyle='rgba(236,72,153,.45)';g.lineWidth=1.5;g.beginPath();tr.forEach((q,i)=>i?g.lineTo(T.tx(q[1]),T.ty(q[2])):g.moveTo(T.tx(q[1]),T.ty(q[2])));g.stroke()}
   const x0=V(R,'x0'),y0=V(R,'y0'),tr=traj(x0,y0,40),bk=back(x0,y0);
   g.strokeStyle='rgba(236,72,153,.35)';g.setLineDash([4,3]);g.lineWidth=1.5;g.beginPath();bk.forEach((q,i)=>i?g.lineTo(T.tx(q[0]),T.ty(q[1])):g.moveTo(T.tx(q[0]),T.ty(q[1])));g.stroke();g.setLineDash([]);
   g.strokeStyle='#ec4899';g.lineWidth=2.8;g.beginPath();tr.forEach((q,i)=>i?g.lineTo(T.tx(q[1]),T.ty(q[2])):g.moveTo(T.tx(q[1]),T.ty(q[2])));g.stroke();

   for(const e of eqi){g.fillStyle=e.cl.startsWith('안정')?'#10b981':e.cl.startsWith('중심')?'#3b82f6':'#ef4444';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(T.tx(e.x),T.ty(e.y),7,0,7);g.fill();g.stroke()}
   g.restore();snap=g.getImageData(0,0,cv.width,cv.height);trC=tr;TC=T;
   $('#lg',R).innerHTML=legend([['#ec4899','궤적 (점선: 과거)'],['#10b981','x′ = 0 널클라인 / 안정 평형점'],['#f59e0b','y′ = 0 널클라인'],['#ef4444','불안정 평형점'],['#3b82f6','중심']]);
   // 시계열
   $('#tsb',R).style.display='';gt.clr();const ys=tr.flatMap(q=>[q[1],q[2]]),lo=Math.min(...ys),hi=Math.max(...ys);plot(gt,{x:46,y:8,w:660,h:150},{xr:[0,tr[tr.length-1][0]],yr:[lo-0.1*(hi-lo+1e-9),hi+0.1*(hi-lo+1e-9)],xl:'t',s:[{d:tr.map(q=>[q[0],q[1]]),c:'#ec4899',w:2},{d:tr.map(q=>[q[0],q[2]]),c:'#3b82f6',w:2}]});
   // 통계와 설명
   const lin=s===ODE2.lin;let anaTxt='',cmpTxt='';
   if(lin){// 행렬 지수함수로 t = 2 에서의 정확한 해
    const {a,b:bb,c,d}=p,t=2,E=eig2(a,bb,c,d),tr2=a+d;let M;const I=[1,0,0,1],A=[a-tr2/2,bb,c,d-tr2/2],dsc=E.disc/4,ex=Math.exp(tr2/2*t);
    let c0,c1;if(dsc>1e-12){const w=Math.sqrt(dsc);c0=Math.cosh(w*t);c1=Math.sinh(w*t)/w}else if(dsc<-1e-12){const w=Math.sqrt(-dsc);c0=Math.cos(w*t);c1=Math.sin(w*t)/w}else{c0=1;c1=t}
    M=[ex*(c0+c1*A[0]),ex*c1*A[1],ex*c1*A[2],ex*(c0+c1*A[3])];const xa=M[0]*x0+M[1]*y0,ya=M[2]*x0+M[3]*y0;
    let s0=[x0,y0];for(let i=0;i<200;i++)s0=rk4((tt,q)=>fv(q[0],q[1]),s0,0,0.01);

   if(s.inv){const H0=s.inv(x0,y0,p),last=tr[tr.length-1],H1=s.inv(last[1],last[2],p);anaTxt+=`<br>${s.invn}: 처음 ${F(H0,8)}, t = ${F(last[0],3)}에서 ${F(H1,8)}`;cmpTxt+=(cmpTxt?'<br>':'')+(s===ODE2.pend&&p.gm>0?`감쇠가 있어 에너지가 줄어듭니다 (${F(H0,4)} → ${F(H1,4)}).`:'보존량 '+cmp(H0,H1,'',1e-6))}

   $('#st',R).innerHTML=eqi.slice(0,4).map((e,i)=>`<div>평형점 (${F(e.x,3)}, ${F(e.y,3)})<b style="font-size:13px">${e.cl}</b></div>`).join('')||'<div>평형점<b>없음</b></div>';
   explain($('#ex',R),{pre:`${s.n}, ${s.p.map(q=>q[1]+' = '+F(p[q[0]],3)).join(', ')}, 초기 조건 (${F(x0,3)}, ${F(y0,3)})`,
    s:'평형점에서 x′ = y′ = 0 입니다. 평형점 근처의 운동은 야코비 행렬(선형화)의 고윳값 λ로 결정됩니다.',
    f:'J = [[∂f/∂x, ∂f/∂y], [∂g/∂x, ∂g/∂y]],  λ = (tr ± √(tr² − 4det))/2 — det < 0: 안장점, 실근 두 개 같은 부호: 마디, 복소근: 나선(실수부 < 0이면 안정), 실수부 = 0: 중심',
    c:eqi.map(e=>`(${F(e.x,4)}, ${F(e.y,4)}): J = [[${F(e.J[0],3)}, ${F(e.J[1],3)}], [${F(e.J[2],3)}, ${F(e.J[3],3)}]], tr = ${F(e.E.tr,3)}, det = ${F(e.E.det,3)} → λ = ${e.E.im[0]?`${F(e.E.re[0],3)} ± ${F(Math.abs(e.E.im[0]),3)}i`:`${F(e.E.re[0],3)}, ${F(e.E.re[1],3)}`} → <b>${e.cl}</b>`).join('<br>')+anaTxt,
    r:(cmpTxt||'')+(s===ODE2.lv?'<br>로트카–볼테라 계에서는 보존량 때문에 궤적이 닫힌 곡선(주기 운동)이 되어, 선형화로 “중심”으로 판정된 점이 실제로도 중심입니다.':s===ODE2.pend&&p.gm===0?'<br>감쇠가 없으면 (0, 0)은 중심, (±π, 0)은 안장점입니다. 에너지가 2(g/L)보다 크면 진자가 한 바퀴씩 돕니다.':'')})}
  return anim(()=>{if(dirty){dirty=false;dim()==='1'?draw1():draw2()}
   else if(dim()==='2'&&snap&&trC){g.putImageData(snap,0,0);anim0=(anim0+1)%trC.length;const q=trC[anim0];g.fillStyle='#ec4899';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(TC.tx(q[1]),TC.ty(q[2]),6,0,7);g.fill();g.stroke()}})}});
